name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 同步 Capacitor 配置到 iOS 工程
        run: |
          npm install
          npx cap sync ios

      - name: 修复缺失的图标资源目录
        run: |
          rm -rf ios/App/App/Assets.xcassets
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cat << 'EOF' > ios/App/App/Assets.xcassets/Contents.json
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          cat << 'EOF' > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: 无证书编译 iOS 应用
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 打包生成 IPA 文件
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r WebApp-Unsigned.ipa Payload

      - name: 上传 IPA 供下载
        uses: actions/upload-artifact@v4
        with:
          name: WebApp-IPA
          path: WebApp-Unsigned.ipa
